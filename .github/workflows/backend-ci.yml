name: Backend CI

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/backend-ci.yml"
  pull_request:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/backend-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Test backend
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: sqlite://
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Check application imports
        run: |
          python - <<'PY'
          from app.main import app

          paths = {route.path for route in app.routes}
          assert {"/health", "/health/ready"}.issubset(paths)
          PY

      - name: Run tests when present
        run: |
          if find tests -type f -name 'test_*.py' -print -quit | grep -q .; then
            python -m pytest -q
          else
            echo "No test files found; skipping pytest."
          fi

      - name: Build backend image
        run: docker build --tag greenscan-backend:ci .
